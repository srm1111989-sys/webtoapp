<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website to App</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icons/icon48.png" alt="WebToApp" class="logo">
      <h1>Website to App</h1>
    </div>

    <div class="current-site" id="currentSite">
      <span class="label">Current website</span>
      <span class="url" id="siteUrl">Loading...</span>
    </div>

    <button class="btn-primary" id="analyzeBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      Analyze for App Conversion
    </button>

    <!-- Loading -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <span>Analyzing website...</span>
    </div>

    <!-- Analysis Results -->
    <div id="analysisResults" class="analysis hidden">
      <div class="score-header">
        <div class="score-circle" id="scoreCircle">
          <span id="scoreValue">--</span>
        </div>
        <div class="score-text">
          <span class="score-label" id="scoreLabel">App Readiness Score</span>
          <span class="score-desc" id="scoreDesc">Analyzing...</span>
        </div>
      </div>

      <div class="checks" id="checksList"></div>
    </div>

    <!-- Convert button (shown after analysis) -->
    <button class="btn-convert hidden" id="convertBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
        <line x1="12" y1="18" x2="12" y2="18"/>
      </svg>
      Convert to Android App
    </button>

    <div class="footer">
      <a href="https://websitetoapp.app" target="_blank">websitetoapp.app</a>
      <span class="separator">|</span>
      <span class="free-tag">Free plan available</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
