image: jangrewe/gitlab-ci-android

stages:
  - prepare
  - build
  - deploy

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"
  JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
  GRADLE_USER_HOME: "${CI_PROJECT_DIR}/.gradle"

cache:
  key: android-deps-v1
  paths:
    - .gradle/wrapper/
    - .gradle/caches/
    - .gradle/notifications/
    - app/build/intermediates/
    - /root/.android/

prepare:
  stage: prepare
  script:
    # Install Java 17 (AGP 8.x requires it)
    - apt-get update -qq && apt-get install -y -qq openjdk-17-jdk > /dev/null 2>&1
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - export PATH=$JAVA_HOME/bin:$PATH
    - java -version

    # Install SDK 36 (required by compileSdk/targetSdk 36)
    - yes | sdkmanager "platforms;android-36" > /dev/null 2>&1 || true

    # Bootstrap Gradle wrapper if not present
    - |
      if [ ! -f ./gradlew ]; then
        echo "Downloading Gradle to generate wrapper..."
        curl -sL "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -o /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /tmp/
        /tmp/gradle-8.4/bin/gradle wrapper --gradle-version 8.4
        rm -rf /tmp/gradle.zip /tmp/gradle-8.4
      fi
    - chmod +x ./gradlew

    # Use custom keystore if provided, otherwise generate one
    - |
      if [ -n "${CUSTOM_KEYSTORE_URL}" ]; then
        echo "Downloading custom keystore..."
        # wget isn't installed until the icon step — install it here too
        apt-get install -y -qq wget > /dev/null 2>&1 || true
        wget -q "${CUSTOM_KEYSTORE_URL}" -O keystore.jks
        KS_PASS="${CUSTOM_KEYSTORE_PASSWORD}"
        KS_ALIAS="${CUSTOM_KEYSTORE_ALIAS}"
        KEY_PASS="${CUSTOM_KEYSTORE_PRIVATE_PASSWORD:-${CUSTOM_KEYSTORE_PASSWORD}}"
        echo "KEYSTORE_PASSWORD=$KS_PASS" > keystore.env
        echo "KEY_ALIAS=$KS_ALIAS" >> keystore.env
        echo "KEY_PASSWORD=$KEY_PASS" >> keystore.env
        echo "Custom keystore configured."
      else
        KS_PASS="$(head -c 200 /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 24)"
        KS_ALIAS="upload-key"
        echo "Generating release keystore..."
        keytool -genkeypair \
          -alias "$KS_ALIAS" \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -keystore keystore.jks \
          -storepass "$KS_PASS" \
          -keypass "$KS_PASS" \
          -dname "CN=${APP_NAME:-WebToApp}, OU=Mobile, O=WebToApp, L=Mumbai, ST=Maharashtra, C=IN"
        echo "KEYSTORE_PASSWORD=$KS_PASS" > keystore.env
        echo "KEY_ALIAS=$KS_ALIAS" >> keystore.env
        echo "KEY_PASSWORD=$KS_PASS" >> keystore.env
        echo "Keystore generated: keystore.jks (alias: $KS_ALIAS)"
      fi

    # Replace config.json with build variables
    - |
      if [ -n "$FEATURES_JSON" ]; then
        cat > app/src/main/assets/config.json << HEREDOC
      {
        "app_name": "${APP_NAME}",
        "app_url": "${APP_URL}",
        "app_host": "${APP_HOST}",
        "primary_color": "${PRIMARY_COLOR}",
        "secondary_color": "${SECONDARY_COLOR}",
        "status_bar_color": "${STATUS_BAR_COLOR}",
        "features": ${FEATURES_JSON},
        "navigation_items": ${NAVIGATION_ITEMS:-[]},
        "admob_config": ${ADMOB_CONFIG:-{}},
        "firebase_config": ${FIREBASE_CONFIG:-{}},
        "trial_days": ${TRIAL_DAYS:-0},
        "purchase_url": "${PURCHASE_URL:-}"
      }
      HEREDOC
      fi

    # Download and resize icon, or generate default placeholder
    - apt-get install -y -qq imagemagick wget > /dev/null 2>&1
    - |
      ICON_OK=false
      if [ -n "$ICON_URL" ]; then
        wget -q --timeout=10 "$ICON_URL" -O /tmp/icon_raw 2>/dev/null && [ -s /tmp/icon_raw ] && ICON_OK=true
        if [ "$ICON_OK" = "true" ]; then
          # Validate it's actually an image
          file /tmp/icon_raw | grep -qi "image" && cp /tmp/icon_raw /tmp/icon.png || ICON_OK=false
        fi
        if [ "$ICON_OK" = "false" ]; then
          echo "WARNING: Icon URL invalid or unreachable ($ICON_URL) — using default icon"
          rm -f /tmp/icon_raw
        fi
      fi
      if [ "$ICON_OK" = "false" ]; then
        # Generate a default icon with the app's primary color
        COLOR="${PRIMARY_COLOR:-#2563EB}"
        LETTER=$(echo "${APP_NAME:-W}" | head -c 1 | tr '[:lower:]' '[:upper:]')
        convert -size 512x512 xc:"$COLOR" -fill white -gravity center \
          -pointsize 200 -annotate +0+0 "$LETTER" /tmp/icon.png
      fi
    - |
      for size_dir in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
        dir=$(echo $size_dir | cut -d: -f1)
        size=$(echo $size_dir | cut -d: -f2)
        mkdir -p "app/src/main/res/mipmap-${dir}"
        convert /tmp/icon.png -resize ${size}x${size} "app/src/main/res/mipmap-${dir}/ic_launcher.png"
        convert /tmp/icon.png -resize ${size}x${size} "app/src/main/res/mipmap-${dir}/ic_launcher_round.png"
      done

    # Download splash screen if provided (convert to PNG for AAPT compatibility)
    - |
      if [ -n "$SPLASH_URL" ]; then
        wget -q "$SPLASH_URL" -O /tmp/splash_raw || true
        if [ -s /tmp/splash_raw ]; then
          # Bound the size: oversized user images make AAPT2 time out (build 2026-07-09)
          convert /tmp/splash_raw -resize "1440x2560>" PNG:app/src/main/res/drawable/splash_image.png 2>/dev/null || true
          rm -f /tmp/splash_raw
        fi
      fi

    # Place google-services.json if Firebase is enabled
    - |
      if [ "$FIREBASE_ENABLED" = "true" ] && [ -n "$FIREBASE_CONFIG" ]; then
        echo "$FIREBASE_CONFIG" > app/google-services.json
      fi

    # Configure AdMob — inject meta-data and re-enable provider only when configured
    - |
      if [ "$ADMOB_ENABLED" = "true" ] && [ -n "$ADMOB_CONFIG" ]; then
        ADMOB_APP_ID=$(echo "$ADMOB_CONFIG" | python3 -c "import sys,json; print(json.load(sys.stdin).get('app_id',''))" 2>/dev/null || echo "")
        if [ -n "$ADMOB_APP_ID" ]; then
          # Remove the provider removal line and add AdMob meta-data
          sed -i '/<provider.*MobileAdsInitProvider/,/tools:node="remove" \/>/d' app/src/main/AndroidManifest.xml
          sed -i "s|</application>|        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\" />\n    </application>|" app/src/main/AndroidManifest.xml
          # Ads are on, so the app really does use the advertising ID.
          sed -i 's|<uses-permission android:name="com.google.android.gms.permission.AD_ID" tools:node="remove" />|<uses-permission android:name="com.google.android.gms.permission.AD_ID" />|' app/src/main/AndroidManifest.xml
          echo "AdMob enabled - AD_ID permission kept in the manifest"
        fi
      fi

  artifacts:
    paths:
      - app/src/main/assets/config.json
      - app/src/main/res/
      - app/google-services.json
      - gradlew
      - gradlew.bat
      - gradle/
      - keystore.jks
      - keystore.env
    expire_in: 1 hour

build_apk:
  stage: build
  before_script:
    - apt-get update -qq && apt-get install -y -qq openjdk-17-jdk > /dev/null 2>&1
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - export PATH=$JAVA_HOME/bin:$PATH
    - chmod +x ./gradlew
    # Load keystore env vars for signing
    - |
      if [ -f keystore.env ]; then
        export $(cat keystore.env | xargs)
        export KEYSTORE_PATH="${CI_PROJECT_DIR}/keystore.jks"
      fi
  script:
    - |
      ./gradlew assembleRelease \
        -PAPP_NAME="${APP_NAME}" \
        -PAPP_URL="${APP_URL}" \
        -PAPP_HOST="${APP_HOST}" \
        -PAPP_PACKAGE_NAME="${PACKAGE_NAME}" \
        -PPRIMARY_COLOR="${PRIMARY_COLOR}" \
        -PSECONDARY_COLOR="${SECONDARY_COLOR}" \
        -PSTATUS_BAR_COLOR="${STATUS_BAR_COLOR}" \
        -PFIREBASE_ENABLED="${FIREBASE_ENABLED:-false}" \
        -PADMOB_ENABLED="${ADMOB_ENABLED:-false}" \
        -PVERSION_CODE="${VERSION_CODE:-1}"
  artifacts:
    paths:
      - app/build/outputs/apk/release/app-release.apk
      - keystore.jks
    expire_in: 30 days

build_aab:
  stage: build
  before_script:
    - apt-get update -qq && apt-get install -y -qq openjdk-17-jdk > /dev/null 2>&1
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - export PATH=$JAVA_HOME/bin:$PATH
    - chmod +x ./gradlew
    # Load keystore env vars for signing
    - |
      if [ -f keystore.env ]; then
        export $(cat keystore.env | xargs)
        export KEYSTORE_PATH="${CI_PROJECT_DIR}/keystore.jks"
      fi
  script:
    - |
      ./gradlew bundleRelease \
        -PAPP_NAME="${APP_NAME}" \
        -PAPP_URL="${APP_URL}" \
        -PAPP_HOST="${APP_HOST}" \
        -PAPP_PACKAGE_NAME="${PACKAGE_NAME}" \
        -PPRIMARY_COLOR="${PRIMARY_COLOR}" \
        -PSECONDARY_COLOR="${SECONDARY_COLOR}" \
        -PSTATUS_BAR_COLOR="${STATUS_BAR_COLOR}" \
        -PFIREBASE_ENABLED="${FIREBASE_ENABLED:-false}" \
        -PADMOB_ENABLED="${ADMOB_ENABLED:-false}" \
        -PVERSION_CODE="${VERSION_CODE:-1}"
  artifacts:
    paths:
      - app/build/outputs/bundle/release/app-release.aab
      - keystore.jks
    expire_in: 30 days
  rules:
    - if: $BUILD_AAB == "true"

webhook_notify:
  stage: deploy
  image: curlimages/curl:latest
  variables:
    GIT_STRATEGY: none
  script:
    - |
      if [ -n "$WEBHOOK_URL" ]; then
        curl -X POST "$WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -H "X-Gitlab-Token: $WEBHOOK_TOKEN" \
          -d "{\"object_kind\":\"pipeline\",\"object_attributes\":{\"id\":$CI_PIPELINE_ID,\"status\":\"$CI_PIPELINE_STATUS\"},\"project\":{\"id\":$CI_PROJECT_ID}}"
      fi
  when: always


