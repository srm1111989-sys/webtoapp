services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - buildlogs:/app/logs
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://webtoapp:webtoapp@db:5432/webtoapp
      DATABASE_URL_SYNC: postgresql://webtoapp:webtoapp@db:5432/webtoapp
      REDIS_URL: redis://:${REDIS_PASSWORD:-r3d1s_s3cur3_p@ss}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: webtoapp
      POSTGRES_PASSWORD: webtoapp
      POSTGRES_DB: webtoapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webtoapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-r3d1s_s3cur3_p@ss}
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command DEBUG ""
      --rename-command CONFIG "REDIS_CONFIG_a9f3b7"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-r3d1s_s3cur3_p@ss}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
      - buildlogs:/app/logs
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://webtoapp:webtoapp@db:5432/webtoapp
      DATABASE_URL_SYNC: postgresql://webtoapp:webtoapp@db:5432/webtoapp
      REDIS_URL: redis://:${REDIS_PASSWORD:-r3d1s_s3cur3_p@ss}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://webtoapp:webtoapp@db:5432/webtoapp
      DATABASE_URL_SYNC: postgresql://webtoapp:webtoapp@db:5432/webtoapp
      REDIS_URL: redis://:${REDIS_PASSWORD:-r3d1s_s3cur3_p@ss}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  buildlogs:
