services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_API_URL: ${VITE_API_URL:-}
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - buildlogs:/app/logs
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://webtoapp:webtoapp@db:5432/webtoapp
      DATABASE_URL_SYNC: postgresql://webtoapp:webtoapp@db:5432/webtoapp
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: webtoapp
      POSTGRES_PASSWORD: webtoapp
      POSTGRES_DB: webtoapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webtoapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  buildlogs:
