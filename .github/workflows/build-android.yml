name: Build Android APK/AAB

on:
  workflow_dispatch:
    inputs:
      APP_NAME:
        required: true
      APP_URL:
        required: true
      APP_HOST:
        required: true
      PRIMARY_COLOR:
        default: "#2563EB"
      SECONDARY_COLOR:
        default: "#1E40AF"
      STATUS_BAR_COLOR:
        default: "#1E3A5F"
      PACKAGE_NAME:
        default: "com.webtoapp.app"
      ORDER_ID:
        required: true
      ICON_URL:
        default: ""
      SPLASH_URL:
        default: ""
      FEATURES_JSON:
        default: "{}"
      NAVIGATION_ITEMS:
        default: "[]"
      FIREBASE_ENABLED:
        default: "false"
      _build_provider:
        default: "github"
      FIREBASE_CONFIG:
        default: ""
      ADMOB_ENABLED:
        default: "false"
      ADMOB_CONFIG:
        default: ""
      TRIAL_DAYS:
        default: "0"
      PURCHASE_URL:
        default: ""
      BUILD_AAB:
        default: "false"
      VERSION_CODE:
        default: "1"
      CUSTOM_KEYSTORE_URL:
        default: ""
      CUSTOM_KEYSTORE_PASSWORD:
        default: ""
      CUSTOM_KEYSTORE_ALIAS:
        default: ""
      CUSTOM_KEYSTORE_PRIVATE_PASSWORD:
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-template

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configure app
        run: |
          echo "VERSION_CODE=${{ inputs.VERSION_CODE }}" >> $GITHUB_ENV

          ADMOB_CFG='${{ inputs.ADMOB_CONFIG }}'
          FIREBASE_CFG='${{ inputs.FIREBASE_CONFIG }}'
          [ -z "$ADMOB_CFG" ] && ADMOB_CFG="{}"
          [ -z "$FIREBASE_CFG" ] && FIREBASE_CFG="{}"

          cat > app/src/main/assets/config.json << HEREDOC
          {
            "app_name": "${{ inputs.APP_NAME }}",
            "app_url": "${{ inputs.APP_URL }}",
            "app_host": "${{ inputs.APP_HOST }}",
            "primary_color": "${{ inputs.PRIMARY_COLOR }}",
            "secondary_color": "${{ inputs.SECONDARY_COLOR }}",
            "status_bar_color": "${{ inputs.STATUS_BAR_COLOR }}",
            "features": ${{ inputs.FEATURES_JSON }},
            "navigation_items": ${{ inputs.NAVIGATION_ITEMS }},
            "admob_config": ${ADMOB_CFG},
            "firebase_config": ${FIREBASE_CFG},
            "trial_days": ${{ inputs.TRIAL_DAYS }},
            "purchase_url": "${{ inputs.PURCHASE_URL }}"
          }
          HEREDOC

          # Firebase: the google-services gms plugin only activates when
          # app/google-services.json exists (build.gradle: file("google-services.json").exists()).
          # GitLab CI wrote this file but the GitHub workflows did not, so push was silently disabled.
          if [ "${{ inputs.FIREBASE_ENABLED }}" = "true" ] && [ -n "$FIREBASE_CFG" ] && [ "$FIREBASE_CFG" != "{}" ]; then
            printf '%s' "$FIREBASE_CFG" > app/google-services.json
            echo "Wrote app/google-services.json for Firebase (enabled)"
          fi

      - name: Process keystore
        run: |
          if [ -n "${{ inputs.CUSTOM_KEYSTORE_URL }}" ]; then
            echo "Custom keystore URL provided. Downloading..."
            wget -q "${{ inputs.CUSTOM_KEYSTORE_URL }}" -O keystore.jks
            echo "KEYSTORE_PASSWORD=${{ inputs.CUSTOM_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ inputs.CUSTOM_KEYSTORE_ALIAS }}" >> $GITHUB_ENV
            KEY_PASS="${{ inputs.CUSTOM_KEYSTORE_PRIVATE_PASSWORD }}"
            if [ -z "$KEY_PASS" ]; then
              KEY_PASS="${{ inputs.CUSTOM_KEYSTORE_PASSWORD }}"
            fi
            echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=$PWD/keystore.jks" >> $GITHUB_ENV
            echo "Custom keystore configured successfully."
          else
            KS_PASS="WebToApp2025!"
            keytool -genkeypair \
              -alias upload-key \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore keystore.jks \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=${{ inputs.APP_NAME }}, OU=Mobile, O=WebToApp, L=Mumbai, ST=Maharashtra, C=IN"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload-key" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KS_PASS" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=$PWD/keystore.jks" >> $GITHUB_ENV
          fi

      - name: Process icon
        run: |
          sudo apt-get install -y -qq imagemagick
          if [ -n "${{ inputs.ICON_URL }}" ]; then
            wget -q --timeout=15 --tries=3 --user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" "${{ inputs.ICON_URL }}" -O /tmp/icon.png || convert -size 512x512 xc:"${{ inputs.PRIMARY_COLOR }}" -fill white -gravity center -pointsize 200 -annotate +0+0 "W" /tmp/icon.png
          else
            convert -size 512x512 xc:"${{ inputs.PRIMARY_COLOR }}" -fill white -gravity center -pointsize 200 -annotate +0+0 "W" /tmp/icon.png
          fi
          for size_dir in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            dir=$(echo $size_dir | cut -d: -f1)
            size=$(echo $size_dir | cut -d: -f2)
            mkdir -p "app/src/main/res/mipmap-${dir}"
            convert /tmp/icon.png -resize ${size}x${size} "app/src/main/res/mipmap-${dir}/ic_launcher.png"
            convert /tmp/icon.png -resize ${size}x${size} "app/src/main/res/mipmap-${dir}/ic_launcher_round.png"
          done

      - name: Process notification icon
        run: |
          NURL=$(grep -oE '"notification_icon_url":[[:space:]]*"[^"]*"' app/src/main/assets/config.json 2>/dev/null | grep -oE 'https?://[^"]*' | head -1)
          if [ -n "$NURL" ]; then
            wget -q "$NURL" -O /tmp/notif_raw || true
            if [ -s /tmp/notif_raw ] && file /tmp/notif_raw | grep -qi image; then
              mkdir -p app/src/main/res/drawable app/src/main/res/raw
              convert /tmp/notif_raw -resize 96x96 -background none app/src/main/res/drawable/ic_stat_notification.png || true
              printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources xmlns:tools="http://schemas.android.com/tools" tools:keep="@drawable/ic_stat_notification" />' > app/src/main/res/raw/keep.xml
              # Register icon for background/quit FCM notifications (system tray uses manifest meta-data, not FCMService)
              MF=app/src/main/AndroidManifest.xml
              if [ -f "" ] && ! grep -q default_notification_icon ""; then
                sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_notification" /></application>#' ""
              fi
            fi
          fi

      - name: Process splash screen
        if: inputs.SPLASH_URL != ''
        run: |
          wget -q --timeout=15 --tries=3 --user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" "${{ inputs.SPLASH_URL }}" -O /tmp/splash_raw || true
          if [ -s /tmp/splash_raw ]; then
            convert '/tmp/splash_raw[0]' -resize "1440x2560>" PNG:app/src/main/res/drawable/splash_image.png || true
          fi

      - name: Configure AdMob manifest
        if: inputs.ADMOB_ENABLED == 'true'
        run: |
          MF=app/src/main/AndroidManifest.xml
          APP_ID=$(printf '%s' '${{ inputs.ADMOB_CONFIG }}' | grep -oE 'ca-app-pub-[0-9]+~[0-9]+' | head -1)
          if [ -n "$APP_ID" ] && ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MF"; then
            sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APP_ID\" /></application>#" "$MF"
            echo "AdMob APPLICATION_ID set: $APP_ID"
          else
            echo "AdMob: no valid app_id (ca-app-pub-...~...) or already set"
          fi
          # Ads are on, so the app really does use the advertising ID.
          sed -i 's|<uses-permission android:name="com.google.android.gms.permission.AD_ID" tools:node="remove" />|<uses-permission android:name="com.google.android.gms.permission.AD_ID" />|' "$MF"
          echo "AdMob enabled - AD_ID permission kept in the manifest"

      - name: Configure overlay manifest
        run: |
          MF=app/src/main/AndroidManifest.xml
          # Overlay ("incoming request") perms are stripped by default so ordinary
          # apps don't declare FGS_SPECIAL_USE (Play flags it). Re-enable only for
          # the paid Rahatna overlay feature, keyed on FEATURES_JSON flags.
          if printf '%s' '${{ inputs.FEATURES_JSON }}' | grep -qE '"incoming_request_overlay"[[:space:]]*:[[:space:]]*true'; then
            sed -i 's|<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" tools:node="remove" />|<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />|' "$MF"
            sed -i 's|<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" tools:node="remove" />|<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />|' "$MF"
            sed -i '/android:name=".FloatingOverlayService"/,/>/ { /tools:node="remove"/d; }' "$MF"
            echo "Overlay enabled - SYSTEM_ALERT_WINDOW + specialUse FGS kept"
          else
            echo "Overlay disabled - overlay permissions/service stripped from merged manifest"
          fi
          if printf '%s' '${{ inputs.FEATURES_JSON }}' | grep -qE '"incoming_request_fullscreen"[[:space:]]*:[[:space:]]*true'; then
            sed -i '/android:name=".IncomingRequestActivity"/,/>/ { /tools:node="remove"/d; }' "$MF"
            echo "Fullscreen overlay enabled - IncomingRequestActivity kept"
          fi

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PAPP_NAME="${{ inputs.APP_NAME }}" \
            -PAPP_URL="${{ inputs.APP_URL }}" \
            -PAPP_HOST="${{ inputs.APP_HOST }}" \
            -PAPP_PACKAGE_NAME="${{ inputs.PACKAGE_NAME }}" \
            -PPRIMARY_COLOR="${{ inputs.PRIMARY_COLOR }}" \
            -PSECONDARY_COLOR="${{ inputs.SECONDARY_COLOR }}" \
            -PSTATUS_BAR_COLOR="${{ inputs.STATUS_BAR_COLOR }}" \
            -PFIREBASE_ENABLED="${{ inputs.FIREBASE_ENABLED }}" \
            -PADMOB_ENABLED="${{ inputs.ADMOB_ENABLED }}" \
            -PVERSION_CODE="${{ inputs.VERSION_CODE }}"

      - name: Build AAB
        if: inputs.BUILD_AAB == 'true'
        run: |
          ./gradlew bundleRelease \
            -PAPP_NAME="${{ inputs.APP_NAME }}" \
            -PAPP_URL="${{ inputs.APP_URL }}" \
            -PAPP_HOST="${{ inputs.APP_HOST }}" \
            -PAPP_PACKAGE_NAME="${{ inputs.PACKAGE_NAME }}" \
            -PPRIMARY_COLOR="${{ inputs.PRIMARY_COLOR }}" \
            -PSECONDARY_COLOR="${{ inputs.SECONDARY_COLOR }}" \
            -PSTATUS_BAR_COLOR="${{ inputs.STATUS_BAR_COLOR }}" \
            -PFIREBASE_ENABLED="${{ inputs.FIREBASE_ENABLED }}" \
            -PADMOB_ENABLED="${{ inputs.ADMOB_ENABLED }}" \
            -PVERSION_CODE="${{ inputs.VERSION_CODE }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-template/app/build/outputs/apk/release/app-release.apk
          retention-days: 3

      - name: Upload AAB
        if: inputs.BUILD_AAB == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android-template/app/build/outputs/bundle/release/app-release.aab
          retention-days: 3

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: android-template/keystore.jks
          retention-days: 3

      - name: Notify webhook
        if: always()
        run: |
          if [ -n "${{ secrets.WEBHOOK_URL }}" ]; then
            curl -X POST "${{ secrets.WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -H "X-Github-Token: ${{ secrets.WEBHOOK_TOKEN }}" \
              -d '{"object_kind":"pipeline","object_attributes":{"id":${{ github.run_id }},"status":"${{ job.status }}"},"project":{"id":0}}'
          fi
